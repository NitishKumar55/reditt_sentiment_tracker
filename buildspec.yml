version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
  
  build:
    commands:
      - echo "Cleaning lib..."
      - rm -rf flink_job/lib
      - mkdir -p flink_job/lib
      - cd flink_job/lib
      
      - echo "Downloading Kinesis SQL connector for Flink 1.20..."
      - wget -q https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-kinesis/5.0.0-1.20/flink-sql-connector-kinesis-5.0.0-1.20.jar
      
      - echo "Downloading DynamoDB SQL connector for Flink 1.20..."
      - wget -q https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-dynamodb/5.0.0-1.20/flink-sql-connector-dynamodb-5.0.0-1.20.jar
      
      - echo "Verifying..."
      - ls -la
      - cd ../..
      
      - echo "Zipping..."
      - cd flink_job
      - zip -r ../flink_app.zip .
      - cd ..
      
      - echo "Uploading..."
      - aws s3 cp flink_app.zip s3://nitish-wiki-monitor-code/flink_app.zip
      - aws s3 sync producer/ s3://nitish-wiki-monitor-code/producer/ --delete
      - aws s3 sync infra/ s3://nitish-wiki-monitor-code/infra/ --delete
  
  post_build:
    commands:
      - echo "Build done."